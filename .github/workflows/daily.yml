name: Daily Roblox Intel

on:
  schedule:
    - cron: "17 14 * * *"   # every day at 14:17 UTC; edit to taste (cron is always UTC)
  workflow_dispatch:         # "Run workflow" button for manual runs
    inputs:
      discord:
        description: "Send the Discord brief"
        type: boolean
        default: true

permissions:
  contents: write    # commit the day's data/ to the repo
  pages: write       # publish the dashboard
  id-token: write    # required by actions/deploy-pages

concurrency:
  group: roblox-intel
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      site: ${{ steps.site.outputs.uploaded }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Restore HTTP cache
        uses: actions/cache@v6
        with:
          path: .cache/http
          key: http-cache-${{ github.run_id }}
          restore-keys: http-cache-

      - name: Start the local AI model (free, runs on this machine)
        continue-on-error: true   # without it, summaries fall back to keywords
        timeout-minutes: 10
        run: |
          models=$(python -c "from roblox_intel.config import load_settings as s; c = s()['summarizer']; print(' '.join(c['local']['models']) if c['provider'] in ('auto', 'local') else '')")
          if [ -z "$models" ]; then echo "Local AI not used (summarizer.provider)."; exit 0; fi
          curl -fsSL https://ollama.com/install.sh | sh
          if ! curl -sf http://127.0.0.1:11434/api/version > /dev/null; then
            (nohup ollama serve > /tmp/ollama.log 2>&1 &)
          fi
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:11434/api/version > /dev/null && break; sleep 2; done
          for m in $models; do ollama pull "$m" && exit 0; done
          exit 1

      - name: Check data sources
        run: python -m roblox_intel check-sources
        continue-on-error: true   # a failing source is reported, not fatal
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}

      - name: Collect, analyze, send Discord brief, build dashboard
        run: python -m roblox_intel run ${{ github.event_name == 'workflow_dispatch' && !inputs.discord && '--no-discord' || '' }}
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}   # optional, only for a hosted AI

      - name: Commit history
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "No data changes."; exit 0; fi
          git commit -q -m "data: daily snapshot $(date -u +%F)"
          for attempt in 1 2 3 4; do
            git pull -q --rebase origin "$GITHUB_REF_NAME" && git push -q origin "HEAD:$GITHUB_REF_NAME" && exit 0
            sleep $((attempt * 5))
          done
          exit 1

      - name: Upload dashboard
        if: ${{ !cancelled() && hashFiles('_site/index.html') != '' }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Mark dashboard ready
        id: site
        if: ${{ !cancelled() && hashFiles('_site/index.html') != '' }}
        run: echo "uploaded=true" >> "$GITHUB_OUTPUT"

  deploy:
    needs: collect
    if: ${{ !cancelled() && needs.collect.outputs.site == 'true' }}
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
