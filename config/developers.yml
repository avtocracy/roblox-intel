# Developers and studios that Roblox Intel tracks.
#
# Add one entry per developer, in any of three ways:
#
#   - game: https://www.roblox.com/games/2753915549/Blox-Fruits
#     expect: Blox Fruits      # optional safety check on the game's name
#       -> tracks whoever owns that game (group or user), looked up automatically.
#
#   - group: 1234567           # from roblox.com/communities/1234567/...
#     name: Some Studio        # optional label for reports
#
#   - user: 7654321            # from roblox.com/users/7654321/profile
#     name: Some Developer
#
# To stop tracking someone, delete their entry. History already collected stays
# in data/. Run `python -m roblox_intel suggest-developers` to list the owners of
# today's top games that you are not tracking yet, as entries ready to paste here.
#
# The defaults below point at the studios behind the biggest current games.
# Owners are looked up from each game link on every run (and re-checked weekly),
# so acquisitions and transfers are picked up. If a link stops matching its
# `expect` name, the entry is skipped and flagged in the run's source-health
# report instead of tracking the wrong studio.

